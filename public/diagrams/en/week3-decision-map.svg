<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 305" width="620" height="305" role="img" aria-labelledby="t d">
<title id="t">Decision path from requirements to architecture choices</title>
<desc id="d">A table mapping each requirement axis to the choice it drives; this mapping leads to the best architecture.</desc>
<style>
  .bx{fill:#22272e;stroke:#373e47}
  .t{fill:#adbac7;font:500 14px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .m{fill:#768390;font:400 12.5px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .h{fill:#adbac7;font:600 14.5px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .ln{stroke:#545d68;stroke-width:1.5;fill:none}
</style>
<rect class="bx" x="1" y="1" width="618" height="303" rx="8"/>
<rect x="14" y="14" width="592" height="277" rx="7" fill="#6cb6ff" fill-opacity=".05" stroke="#6cb6ff" stroke-opacity=".45"/>
<text class="h" x="30" y="38" fill="#6cb6ff">Requirements analysis → best architecture choice</text><rect x="30" y="52" width="560" height="42" rx="4" fill="#22272e" stroke="#373e47"/>
<text class="t" x="44" y="78" fill="#adbac7">Workload characteristics</text><text class="m" x="576" y="78" text-anchor="end">→ Instance family</text><rect x="30" y="99" width="560" height="42" rx="4" fill="#22272e" stroke="#373e47"/>
<text class="t" x="44" y="125" fill="#adbac7">Cost · commitment</text><text class="m" x="576" y="125" text-anchor="end">→ Purchase option</text><rect x="30" y="146" width="560" height="42" rx="4" fill="#22272e" stroke="#373e47"/>
<text class="t" x="44" y="172" fill="#adbac7">Data durability · sharing</text><text class="m" x="576" y="172" text-anchor="end">→ Storage type</text><rect x="30" y="193" width="560" height="42" rx="4" fill="#22272e" stroke="#373e47"/>
<text class="t" x="44" y="219" fill="#adbac7">Traffic type</text><text class="m" x="576" y="219" text-anchor="end">→ ELB type</text><rect x="30" y="240" width="560" height="42" rx="4" fill="#22272e" stroke="#373e47"/>
<text class="t" x="44" y="266" fill="#adbac7">Load variation pattern</text><text class="m" x="576" y="266" text-anchor="end">→ Scaling policy</text>
</svg>
