<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d">
  <title id="t">Purchased capacity vs. actual demand</title>
  <desc id="d">Fixed equipment capacity is a flat horizontal line, but actual demand rises and falls. Where demand is below capacity you pay for unused waste; where demand exceeds capacity the service fails.</desc>

  <style>
    .bg    { fill: #22272e; stroke: #373e47; }
    .axis  { stroke: #545d68; stroke-width: 1.5; }
    .grid  { stroke: #2d333b; stroke-width: 1; }
    .cap   { stroke: #f0a35e; stroke-width: 2.5; fill: none; }
    .dem   { stroke: #6cb6ff; stroke-width: 2.5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    .waste { fill: #f0a35e; opacity: .16; }
    .short { fill: #f47067; opacity: .34; }
    .lbl   { fill: #adbac7; font: 500 14px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
    .ax    { fill: #768390; font: 500 13px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
    .note  { fill: #768390; font: 400 12.5px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
    .lead  { stroke: #545d68; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <rect class="bg" x="1" y="1" width="718" height="298" rx="8"/>

  <!-- Area between demand and capacity (XOR). Clipped below = waste, clipped above = outage -->
  <defs>
    <clipPath id="below"><rect x="70" y="96" width="600" height="150"/></clipPath>
    <clipPath id="above"><rect x="70" y="20"  width="600" height="76"/></clipPath>
    <path id="between"
      d="M70,96 H610 V240 H70 Z
         M70,214 C110,208 140,190 170,158 C200,128 226,120 252,132
         C278,144 296,178 322,180 C348,182 370,160 396,132
         C416,110 432,74 452,66 C474,57 492,84 510,116
         C534,158 560,190 592,202 C602,206 606,208 610,209 V240 H70 Z"/>
  </defs>
  <use href="#between" class="waste" fill-rule="evenodd" clip-path="url(#below)"/>
  <use href="#between" class="short" fill-rule="evenodd" clip-path="url(#above)"/>

  <!-- Grid -->
  <line class="grid" x1="70" y1="60"  x2="670" y2="60"/>
  <line class="grid" x1="70" y1="130" x2="670" y2="130"/>
  <line class="grid" x1="70" y1="175" x2="670" y2="175"/>

  <!-- Axes -->
  <line class="axis" x1="70" y1="26" x2="70"  y2="240"/>
  <line class="axis" x1="70" y1="240" x2="670" y2="240"/>
  <text class="ax" x="70" y="18" text-anchor="middle">Capacity</text>
  <text class="ax" x="670" y="258" text-anchor="end">Time →</text>

  <!-- Fixed capacity -->
  <line class="cap" x1="70" y1="96" x2="610" y2="96"/>

  <!-- Actual demand -->
  <path class="dem"
    d="M70,214 C110,208 140,190 170,158 C200,128 226,120 252,132
       C278,144 296,178 322,180 C348,182 370,160 396,132
       C416,110 432,74 452,66 C474,57 492,84 510,116
       C534,158 560,190 592,202 C602,206 606,208 610,209"/>

  <!-- Labels -->
  <text class="lbl" x="618" y="92" fill="#f0a35e">Capacity</text>
  <text class="note" x="618" y="108">Fixed, static</text>

  <text class="lbl" x="618" y="212" fill="#6cb6ff">Demand</text>
  <text class="note" x="618" y="228">Fluctuates</text>

  <!-- Legend: text inside the chart would overlap the curves, so it sits below -->
  <rect x="70" y="272" width="13" height="13" rx="2" fill="#f0a35e" opacity=".38"/>
  <text class="note" x="91" y="283">Headroom = paid but unused</text>

  <rect x="300" y="272" width="13" height="13" rx="2" fill="#f47067" opacity=".55"/>
  <text class="note" x="321" y="283">Above capacity = service outage</text>
</svg>
