<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490" width="560" height="490" role="img" aria-labelledby="t d">
<title id="t">Typical CNN structure</title>
<desc id="d">The input image goes through repeated convolution and pooling, abstracting from low-level to high-level patterns, and the final Dense and Softmax layers output class probabilities.</desc>
<style>
  .bx{fill:#22272e;stroke:#373e47}
  .t{fill:#adbac7;font:500 14px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .m{fill:#768390;font:400 12.5px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .h{fill:#adbac7;font:600 14.5px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .ln{stroke:#545d68;stroke-width:1.5;fill:none}
</style>
<rect class="bx" x="1" y="1" width="558" height="488" rx="8"/>
<marker id="a-545d68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#545d68"/></marker><rect x="40" y="20" width="300" height="52" rx="6" fill="#22272e" stroke="#768390" stroke-opacity=".7"/>
<text class="h" x="56" y="43">Input 224×224×3</text><text class="m" x="56" y="61">Original image</text><line class="ln" x1="190" y1="76" x2="190" y2="106" marker-end="url(#a-545d68)"/><text class="m" x="200" y="96">Conv + ReLU — edges, color changes</text><rect x="40" y="112" width="300" height="52" rx="6" fill="#22272e" stroke="#6cb6ff" stroke-opacity=".7"/>
<text class="h" x="56" y="135">Feature map (low-level)</text><text class="m" x="56" y="153">Pool shrinks spatial size</text><line class="ln" x1="190" y1="168" x2="190" y2="198" marker-end="url(#a-545d68)"/><text class="m" x="200" y="188">Conv + ReLU — textures, parts (eyes, ears)</text><rect x="40" y="204" width="300" height="52" rx="6" fill="#22272e" stroke="#6cb6ff" stroke-opacity=".7"/>
<text class="h" x="56" y="227">Feature map (mid-level)</text><text class="m" x="56" y="245">Pool</text><line class="ln" x1="190" y1="260" x2="190" y2="290" marker-end="url(#a-545d68)"/><text class="m" x="200" y="280">Conv + ReLU — whole-object level</text><rect x="40" y="296" width="300" height="52" rx="6" fill="#22272e" stroke="#f0a35e" stroke-opacity=".7"/>
<text class="h" x="56" y="319">Feature map (high-level)</text><text class="m" x="56" y="337">Flatten or Global Average Pooling</text><line class="ln" x1="190" y1="352" x2="190" y2="382" marker-end="url(#a-545d68)"/><rect x="40" y="388" width="300" height="52" rx="6" fill="#22272e" stroke="#8ddb8c" stroke-opacity=".7"/>
<text class="h" x="56" y="411">Dense → Softmax</text><text class="m" x="56" y="429">Class probabilities — retrained in transfer learning</text>
</svg>
