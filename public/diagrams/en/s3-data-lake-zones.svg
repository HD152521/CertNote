<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" width="720" height="170" role="img" aria-labelledby="t d">
<title id="t">Three zones of an S3 data lake</title>
<desc id="d">Data is refined in order: Raw keeps the original immutable, Cleaned is validated, and Curated is processed for training.</desc>
<style>
  .bx{fill:#22272e;stroke:#373e47}
  .t{fill:#adbac7;font:500 14px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .m{fill:#768390;font:400 12.5px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .h{fill:#adbac7;font:600 14.5px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .ln{stroke:#545d68;stroke-width:1.5;fill:none}
</style>
<rect class="bx" x="1" y="1" width="718" height="168" rx="8"/>
<marker id="a-6cb6ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6cb6ff"/></marker><rect x="22" y="20" width="218" height="84" rx="6" fill="#768390" fill-opacity=".09" stroke="#768390" stroke-opacity=".5"/>
<text class="h" x="131" y="45" text-anchor="middle" fill="#768390">Raw</text><text class="m" x="131" y="66" text-anchor="middle">As-is from the source</text><text class="m" x="131" y="85" text-anchor="middle">Immutable — never overwritten</text><line x1="241" y1="62" x2="249" y2="62" stroke="#6cb6ff" stroke-width="1.6" marker-end="url(#a-6cb6ff)"/><rect x="250" y="20" width="218" height="84" rx="6" fill="#6cb6ff" fill-opacity=".09" stroke="#6cb6ff" stroke-opacity=".5"/>
<text class="h" x="359" y="45" text-anchor="middle" fill="#6cb6ff">Cleaned</text><text class="m" x="359" y="66" text-anchor="middle">Cleaned · validated</text><text class="m" x="359" y="85" text-anchor="middle">Schema finalized</text><line x1="469" y1="62" x2="477" y2="62" stroke="#6cb6ff" stroke-width="1.6" marker-end="url(#a-6cb6ff)"/><rect x="478" y="20" width="218" height="84" rx="6" fill="#8ddb8c" fill-opacity=".09" stroke="#8ddb8c" stroke-opacity=".5"/>
<text class="h" x="587" y="45" text-anchor="middle" fill="#8ddb8c">Curated</text><text class="m" x="587" y="66" text-anchor="middle">Features engineered</text><text class="m" x="587" y="85" text-anchor="middle">Ready for training</text><rect x="22" y="128" width="676" height="34" rx="5" fill="#8ddb8c" fill-opacity=".08" stroke="#8ddb8c" stroke-opacity=".45"/>
<text class="m" x="360" y="150" text-anchor="middle" fill="#8ddb8c">If a transform bug is found, reprocess from Raw — that is why Raw must be immutable</text>
</svg>
