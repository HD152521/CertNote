<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 190" width="700" height="190" role="img" aria-labelledby="t d">
<title id="t">Switching between foreground and background</title>
<desc id="d">Suspend a foreground job with Ctrl+Z, send it to the background with bg, and bring it back with fg.</desc>
<style>
  .bx{fill:#22272e;stroke:#373e47}
  .t{fill:#adbac7;font:500 14px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .m{fill:#768390;font:400 12.5px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .h{fill:#adbac7;font:600 14.5px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .ln{stroke:#545d68;stroke-width:1.5;fill:none}
</style>
<rect class="bx" x="1" y="1" width="698" height="188" rx="8"/>
<marker id="a-6cb6ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6cb6ff"/></marker><marker id="a-f0a35e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0a35e"/></marker><rect x="30" y="34" width="140" height="50" rx="6" fill="#6cb6ff" fill-opacity=".1" stroke="#6cb6ff" stroke-opacity=".6"/>
<text class="t" x="100" y="65" text-anchor="middle">Run command</text><line x1="175" y1="59" x2="191" y2="59" stroke="#6cb6ff" stroke-width="1.8" marker-end="url(#a-6cb6ff)"/><rect x="196" y="34" width="140" height="50" rx="6" fill="#6cb6ff" fill-opacity=".1" stroke="#6cb6ff" stroke-opacity=".6"/>
<text class="t" x="266" y="65" text-anchor="middle">Foreground</text><line x1="341" y1="59" x2="357" y2="59" stroke="#6cb6ff" stroke-width="1.8" marker-end="url(#a-6cb6ff)"/><rect x="362" y="34" width="140" height="50" rx="6" fill="#6cb6ff" fill-opacity=".1" stroke="#6cb6ff" stroke-opacity=".6"/>
<text class="t" x="432" y="65" text-anchor="middle">Stopped (Ctrl+Z)</text><line x1="507" y1="59" x2="523" y2="59" stroke="#6cb6ff" stroke-width="1.8" marker-end="url(#a-6cb6ff)"/><rect x="528" y="34" width="140" height="50" rx="6" fill="#6cb6ff" fill-opacity=".1" stroke="#6cb6ff" stroke-opacity=".6"/>
<text class="t" x="598" y="65" text-anchor="middle">Background (bg)</text><path d="M598,84 V130 H100 V90" fill="none" stroke="#f0a35e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-f0a35e)"/>
<text class="m" x="349" y="121" text-anchor="middle" fill="#f0a35e">fg — back to foreground</text>
</svg>
