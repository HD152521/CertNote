<text class="t" x="171.5" y="41" text-anchor="middle" fill="#f0a35e">KMS 키 정책</text><text class="m" x="171.5" y="59" text-anchor="middle">&quot;이 키를 누가?&quot;</text><line class="ln" x1="171.5" y1="70" x2="171.5" y2="96"/><rect x="339" y="18" width="299" height="52" rx="6" fill="#6cb6ff" fill-opacity=".1" stroke="#6cb6ff" stroke-opacity=".55"/>
