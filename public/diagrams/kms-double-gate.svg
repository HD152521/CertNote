<title id="t">KMS 복호화의 이중 관문 — 키 정책과 IAM 정책</title>
<desc id="d">키 정책과 IAM 권한 정책이 둘 다 허용해야 복호화가 성공한다. 하나라도 허용하지 않으면 실패한다.</desc>
