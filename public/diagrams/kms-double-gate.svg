<rect x="22" y="132" width="616" height="58" rx="6" fill="#8ddb8c" fill-opacity=".12" stroke="#8ddb8c" stroke-opacity=".6"/>
<text class="h" x="330" y="157" text-anchor="middle" fill="#8ddb8c">둘 다 Allow 여야 복호화 성공</text><text class="m" x="330" y="176" text-anchor="middle">하나라도 미허용이면 실패 — IAM 만 열어도 소용없다</text>
