<text class="t" x="83.5" y="65" text-anchor="middle">입력 x</text><line x1="142" y1="59" x2="158" y2="59" stroke="#6cb6ff" stroke-width="1.8" marker-end="url(#a-6cb6ff)"/><rect x="163" y="34" width="107" height="50" rx="6" fill="#6cb6ff" fill-opacity=".1" stroke="#6cb6ff" stroke-opacity=".6"/>
<text class="t" x="216.5" y="65" text-anchor="middle">은닉층 1</text><line x1="275" y1="59" x2="291" y2="59" stroke="#6cb6ff" stroke-width="1.8" marker-end="url(#a-6cb6ff)"/><rect x="296" y="34" width="107" height="50" rx="6" fill="#6cb6ff" fill-opacity=".1" stroke="#6cb6ff" stroke-opacity=".6"/>
<text class="t" x="349.5" y="65" text-anchor="middle">은닉층 2</text><line x1="408" y1="59" x2="424" y2="59" stroke="#6cb6ff" stroke-width="1.8" marker-end="url(#a-6cb6ff)"/><rect x="429" y="34" width="107" height="50" rx="6" fill="#6cb6ff" fill-opacity=".1" stroke="#6cb6ff" stroke-opacity=".6"/>
<text class="t" x="482.5" y="65" text-anchor="middle">출력 ŷ</text><line x1="541" y1="59" x2="557" y2="59" stroke="#6cb6ff" stroke-width="1.8" marker-end="url(#a-6cb6ff)"/><rect x="562" y="34" width="107" height="50" rx="6" fill="#6cb6ff" fill-opacity=".1" stroke="#6cb6ff" stroke-opacity=".6"/>
<text class="t" x="615.5" y="65" text-anchor="middle">손실 L(ŷ, y)</text><path d="M615.5,84 V130 H83.5 V90" fill="none" stroke="#f0a35e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-f0a35e)"/>
<text class="m" x="349.5" y="121" text-anchor="middle" fill="#f0a35e">역전파 — 연쇄법칙으로 ∂L/∂w 를 거슬러 전달, 갱신은 w ← w − η·∂L/∂w</text>
