<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-labelledby="t d">
<title id="t">Feature Store 의 온라인 스토어와 오프라인 스토어</title>
<desc id="d">특성 계산 파이프라인이 Feature Store 에 적재하면 온라인 스토어와 오프라인 스토어로 자동 동기화되어 각각 실시간 추론과 학습 데이터셋 생성에 쓰인다.</desc>
