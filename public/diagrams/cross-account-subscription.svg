<text class="t" x="488.5" y="41" text-anchor="middle" fill="#dcbdfb">Account B — 분석 계정</text><text class="m" x="488.5" y="59" text-anchor="middle">Log Destination</text><line class="ln" x1="488.5" y1="88" x2="488.5" y2="114"/><line class="ln" x1="171.5" y1="114" x2="488.5" y2="114"/>
