<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490" width="560" height="490" role="img" aria-labelledby="t d">
<title id="t">전형적인 CNN 구조</title>
<desc id="d">입력 이미지가 합성곱과 풀링을 반복하며 저수준에서 고수준 패턴으로 추상화되고, 마지막 Dense 와 Softmax 에서 클래스 확률이 나온다.</desc>
<style>
  .bx{fill:#22272e;stroke:#373e47}
  .t{fill:#adbac7;font:500 14px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .m{fill:#768390;font:400 12.5px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .h{fill:#adbac7;font:600 14.5px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .ln{stroke:#545d68;stroke-width:1.5;fill:none}
</style>
<rect class="bx" x="1" y="1" width="558" height="488" rx="8"/>
<marker id="a-545d68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#545d68"/></marker><rect x="40" y="20" width="300" height="52" rx="6" fill="#22272e" stroke="#768390" stroke-opacity=".7"/>
<text class="h" x="56" y="43">입력 224×224×3</text><text class="m" x="56" y="61">원본 이미지</text><line class="ln" x1="190" y1="76" x2="190" y2="106" marker-end="url(#a-545d68)"/><text class="m" x="200" y="96">Conv + ReLU — 경계선·색 변화</text><rect x="40" y="112" width="300" height="52" rx="6" fill="#22272e" stroke="#6cb6ff" stroke-opacity=".7"/>
<text class="h" x="56" y="135">특성 맵 (저수준)</text><text class="m" x="56" y="153">Pool 로 공간 크기 축소</text><line class="ln" x1="190" y1="168" x2="190" y2="198" marker-end="url(#a-545d68)"/><text class="m" x="200" y="188">Conv + ReLU — 질감·부분(눈·귀)</text><rect x="40" y="204" width="300" height="52" rx="6" fill="#22272e" stroke="#6cb6ff" stroke-opacity=".7"/>
<text class="h" x="56" y="227">특성 맵 (중간)</text><text class="m" x="56" y="245">Pool</text><line class="ln" x1="190" y1="260" x2="190" y2="290" marker-end="url(#a-545d68)"/><text class="m" x="200" y="280">Conv + ReLU — 전체 객체 수준</text><rect x="40" y="296" width="300" height="52" rx="6" fill="#22272e" stroke="#f0a35e" stroke-opacity=".7"/>
<text class="h" x="56" y="319">특성 맵 (고수준)</text><text class="m" x="56" y="337">Flatten 또는 Global Average Pooling</text><line class="ln" x1="190" y1="352" x2="190" y2="382" marker-end="url(#a-545d68)"/><rect x="40" y="388" width="300" height="52" rx="6" fill="#22272e" stroke="#8ddb8c" stroke-opacity=".7"/>
<text class="h" x="56" y="411">Dense → Softmax</text><text class="m" x="56" y="429">클래스 확률 — 전이학습은 보통 여기만 새로 학습</text>
</svg>
