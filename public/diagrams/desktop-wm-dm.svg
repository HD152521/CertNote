<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 278" width="620" height="278" role="img" aria-labelledby="t d">
<title id="t">데스크톱 환경 · 윈도 매니저 · 디스플레이 매니저의 자리</title>
<desc id="d">데스크톱 환경이 윈도 매니저를 포함하고, 그 아래를 디스플레이 매니저와 X 서버가 떠받친다.</desc>
<style>
