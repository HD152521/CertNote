<text class="h" x="34" y="40" fill="#6cb6ff">데스크톱 환경 (GNOME · KDE · Xfce)</text><text class="m" x="34" y="58">윈도매니저 + 패널 + 파일관리자 + 기본 응용프로그램</text><rect x="44" y="74" width="532" height="62" rx="6" fill="#dcbdfb" fill-opacity="0.12000000000000001" stroke="#dcbdfb" stroke-opacity=".55"/>
<text class="h" x="58" y="94" fill="#dcbdfb">윈도 매니저 (KWin · Mutter · Xfwm)</text><text class="m" x="58" y="112">창 테두리 · 이동 · 크기조절 · 최소화</text><line class="ln" x1="310" y1="168" x2="310" y2="157" marker-end="url(#a-545d68)"/>
