<text class="h" x="58" y="94" fill="#dcbdfb">머신러닝 (ML)</text><text class="m" x="58" y="112">데이터로 규칙을 스스로 찾는 방법</text><rect x="68" y="128" width="484" height="62" rx="6" fill="#f0a35e" fill-opacity="0.17" stroke="#f0a35e" stroke-opacity=".55"/>
<text class="h" x="82" y="148" fill="#f0a35e">딥러닝 (DL)</text><text class="m" x="82" y="166">신경망을 깊게 쌓은 머신러닝</text>
