<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 398" width="560" height="398" role="img" aria-labelledby="t d">
<title id="t">Route 53 과 CloudFront 가 함께 일하는 순서</title>
<desc id="d">사용자 요청이 Route 53 에서 CloudFront 주소로 안내되고, 캐시가 없을 때만 오리진까지 간다.</desc>
<style>
  .bx{fill:#22272e;stroke:#373e47}
  .t{fill:#adbac7;font:500 14px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .m{fill:#768390;font:400 12.5px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .h{fill:#adbac7;font:600 14.5px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .ln{stroke:#545d68;stroke-width:1.5;fill:none}
</style>
<rect class="bx" x="1" y="1" width="558" height="396" rx="8"/>
<marker id="a-545d68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#545d68"/></marker><rect x="40" y="20" width="300" height="52" rx="6" fill="#22272e" stroke="#768390" stroke-opacity=".7"/>
<text class="h" x="56" y="43">사용자</text><text class="m" x="56" y="61">www.example.com 입력</text><line class="ln" x1="190" y1="76" x2="190" y2="106" marker-end="url(#a-545d68)"/><rect x="40" y="112" width="300" height="52" rx="6" fill="#22272e" stroke="#6cb6ff" stroke-opacity=".7"/>
<text class="h" x="56" y="135">Route 53 (DNS)</text><text class="m" x="56" y="153">이름을 CloudFront 주소로 안내</text><line class="ln" x1="190" y1="168" x2="190" y2="198" marker-end="url(#a-545d68)"/><rect x="40" y="204" width="300" height="52" rx="6" fill="#22272e" stroke="#f0a35e" stroke-opacity=".7"/>
<text class="h" x="56" y="227">CloudFront (엣지/CDN)</text><text class="m" x="56" y="245">가장 가까운 엣지에서 응답</text><text class="m" x="358" y="234">캐시에 있으면 여기서 끝</text><line class="ln" x1="190" y1="260" x2="190" y2="290" marker-end="url(#a-545d68)"/><text class="m" x="200" y="280">캐시 미스일 때만</text><rect x="40" y="296" width="300" height="52" rx="6" fill="#22272e" stroke="#8ddb8c" stroke-opacity=".7"/>
<text class="h" x="56" y="319">오리진 (S3 · EC2)</text><text class="m" x="56" y="337">콘텐츠 원본</text>
</svg>
