<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 224" width="620" height="224" role="img" aria-labelledby="t d">
<title id="t">관리 수준에 따라 움직이는 공동 책임 경계선</title>
<desc id="d">완전 관리형으로 갈수록 고객이 책임질 범위가 좁아지고, IaaS 로 갈수록 OS와 애플리케이션까지 고객 몫이 된다.</desc>
<style>
  .bx{fill:#22272e;stroke:#373e47}
  .t{fill:#adbac7;font:500 14px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .m{fill:#768390;font:400 12.5px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .h{fill:#adbac7;font:600 14.5px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif}
  .ln{stroke:#545d68;stroke-width:1.5;fill:none}
</style>
<rect class="bx" x="1" y="1" width="618" height="222" rx="8"/>
<rect x="20" y="14" width="580" height="44" rx="5" fill="#8ddb8c" fill-opacity=".1" stroke="#8ddb8c" stroke-opacity=".5"/>
<text class="h" x="36" y="41">S3 · DynamoDB · Lambda — 완전 관리형</text><text class="m" x="584" y="41" text-anchor="end">데이터 분류와 IAM 권한만 고객</text><rect x="20" y="64" width="580" height="44" rx="5" fill="#6cb6ff" fill-opacity=".1" stroke="#6cb6ff" stroke-opacity=".5"/>
<text class="h" x="36" y="91">RDS · ECS Fargate — PaaS</text><text class="m" x="584" y="91" text-anchor="end">＋ 네트워크·보안그룹 설정 고객</text><rect x="20" y="114" width="580" height="44" rx="5" fill="#f0a35e" fill-opacity=".1" stroke="#f0a35e" stroke-opacity=".5"/>
<text class="h" x="36" y="141">ECS on EC2 · EKS Self-Managed</text><text class="m" x="584" y="141" text-anchor="end">＋ 컨테이너 런타임·노드 OS 패치 고객</text><rect x="20" y="164" width="580" height="44" rx="5" fill="#f47067" fill-opacity=".1" stroke="#f47067" stroke-opacity=".5"/>
<text class="h" x="36" y="191">EC2 + EBS — IaaS</text><text class="m" x="584" y="191" text-anchor="end">OS·미들웨어·앱 전부 고객</text>
