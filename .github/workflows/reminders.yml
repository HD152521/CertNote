# 알림 발송 크론(무료 대안). Vercel Hobby는 cron이 하루 1회로 제한되므로,
# 사용자별 커스텀 시각을 모두 지원하려면 매시 정각 호출이 필요하다.
# GitHub Actions의 무료 스케줄러로 프로덕션 /api/cron/reminders 를 매시 호출한다.
#
# 사용 전 설정(Settings → Secrets and variables → Actions):
#   - CRON_SECRET : Vercel에 설정한 값과 동일
#   - APP_URL     : 예) https://cert-note.vercel.app
#
# 주의: GitHub Actions 예약은 지연될 수 있다(보통 수 분). 정시 정확도가 중요하면 Vercel Pro cron 권장.
name: review-reminders

on:
  schedule:
    - cron: '0 * * * *' # 매시 정각(UTC)
  workflow_dispatch: {} # 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Secrets 미설정이면 조용히 건너뛴다(실패 메일 방지). 둘 다 설정해야 작동.
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL/CRON_SECRET secrets 미설정 — 건너뜀. 활성화하려면 Settings → Secrets and variables → Actions 에 두 값을 추가하세요."
            exit 0
          fi
          curl -fsS -X GET "$APP_URL/api/cron/reminders" \
            -H "x-cron-secret: $CRON_SECRET" \
            --max-time 60
